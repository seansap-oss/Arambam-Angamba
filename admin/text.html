<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Manager — Angamba Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f1ea;--ink:#1f1f1f;--olive:#59624f;--muted:#746c61;--sand:#ddd2c2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.header{background:var(--ink);color:var(--paper);padding:2rem 6vw;text-align:center}
.header h1{font-family:Cormorant Garamond,serif;font-size:2rem;font-weight:700;margin:0}
.header p{font-size:.85rem;opacity:.7;margin:.5rem 0 0}
.tabs{display:flex;gap:.25rem;justify-content:center;margin-bottom:1rem}
.tab{padding:.35rem 1.25rem;border-radius:50px;font-size:.8rem;font-weight:600;text-decoration:none;color:var(--paper);border:1px solid rgba(255,255,255,.3);transition:all .2s}
.tab:hover{border-color:var(--paper)}
.tab.active{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.container{max-width:1200px;margin:0 auto;padding:2rem 6vw}
.group{margin-bottom:2.5rem}
.group-title{font-family:Cormorant Garamond,serif;font-size:1.4rem;font-weight:700;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--sand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:1rem}
.card{padding:1rem;border-radius:1rem;border:1px solid rgba(31,31,31,.12);background:rgba(255,255,255,.5)}
.info{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;font-size:.85rem}
.key{font-size:.65rem;color:var(--muted);font-family:monospace}
.preview{font-size:.75rem;color:var(--muted);padding:.35rem .6rem;background:rgba(31,31,31,.04);border-radius:.4rem;margin-bottom:.4rem;max-height:2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{display:flex;align-items:center;gap:.25rem;padding:.35rem;background:rgba(31,31,31,.04);border-radius:.4rem .4rem 0 0;flex-wrap:wrap}
.tb-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;border-radius:4px;background:transparent;color:var(--muted);font-family:Inter,sans-serif;font-size:.8rem;cursor:pointer;transition:all .2s}
.tb-btn:hover{background:rgba(31,31,31,.08);color:var(--ink)}
.tb-sep{width:1px;height:18px;background:var(--sand);margin:0 .15rem}
.tb-select{padding:.15rem .3rem;border-radius:4px;border:1px solid var(--sand);background:var(--paper);color:var(--ink);font-size:.7rem;cursor:pointer}
.tb-color{width:28px;height:28px;padding:2px;border:none;border-radius:4px;cursor:pointer;background:none}
.tb-color::-webkit-color-swatch-wrapper{padding:2px}
.tb-color::-webkit-color-swatch{border-radius:3px;border:1px solid var(--sand)}
.editor{min-height:80px;padding:.5rem .7rem;border:1px solid rgba(31,31,31,.2);border-top:none;border-radius:0 0 .4rem .4rem;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;font-size:.85rem;line-height:1.6;outline:none;overflow-y:auto}
.editor:focus{border-color:var(--olive)}
.actions{display:flex;align-items:center;gap:.5rem;margin-top:.6rem}
.btn{padding:.35rem 1rem;border-radius:.4rem;border:none;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-save{background:var(--olive);color:var(--paper)}
.btn-save:hover{opacity:.85}
.btn-reset{background:transparent;color:var(--muted);border:1px solid rgba(31,31,31,.2)}
.btn-reset:hover{border-color:#c44;color:#c44}
.badge{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:.2rem .5rem;border-radius:4px;background:rgba(89,98,79,.15);color:var(--olive);margin-left:auto}
.badge-default{background:rgba(31,31,31,.05);color:var(--muted)}
.footer{display:flex;flex-direction:column;align-items:center;gap:.75rem;padding:2rem 0 4rem}
.footer p{font-size:.75rem;color:var(--muted);margin:0}
.login{display:flex;justify-content:center;align-items:center;min-height:80vh;padding:2rem}
.login-card{max-width:400px;width:100%;padding:2.5rem 2rem;text-align:center;background:rgba(255,255,255,.5);border-radius:1.5rem;border:1px solid rgba(31,31,31,.12)}
.login-card h2{font-family:Cormorant Garamond,serif;font-size:1.5rem;margin:0 0 .5rem}
.login-card p{font-size:.85rem;color:var(--muted);margin:0 0 1.5rem}
.login-form{display:flex;flex-direction:column;gap:.75rem}
.login-input{padding:.75rem 1rem;border-radius:.5rem;border:1px solid rgba(31,31,31,.2);background:var(--paper);color:var(--ink);font-size:1rem;text-align:center}
.login-input:focus{outline:none;border-color:var(--olive)}
.login-btn{padding:.75rem;border-radius:.5rem;border:none;background:var(--ink);color:var(--paper);font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
.login-btn:hover{background:#333}
.login-error{font-size:.8rem;color:#c44;margin:0;min-height:1.2em}
@media(max-width:540px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="login-card">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--olive)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:.5rem"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <h2>Enter Password</h2>
    <p>Restricted area. Enter the admin password to manage text.</p>
    <form class="login-form" id="loginForm">
      <input type="password" class="login-input" id="loginPassword" placeholder="Admin password" autocomplete="off" />
      <button type="submit" class="login-btn">Unlock</button>
      <p class="login-error" id="loginError"></p>
    </form>
    <a href="../" style="display:inline-block;margin-top:1rem;font-size:.8rem;color:var(--muted)">← Back to site</a>
  </div>
</div>

<div id="adminApp" style="display:none">
  <div class="header">
    <div class="tabs">
      <a href="." class="tab">Images</a>
      <a href="text.html" class="tab active">Text</a>
    </div>
    <h1>Text Manager</h1>
    <p>Edit any text on the site with bold, italic, font size, and color.</p>
  </div>
  <div class="container" id="adminContent"></div>
</div>

<script>
const STORAGE_KEY='aa-custom-texts';
const PW_HASH='YXZpdDIwMjQ=';
const AUTH_KEY='aa-admin-auth';

(function(){if(sessionStorage.getItem(AUTH_KEY)){document.getElementById('loginScreen').style.display='none';document.getElementById('adminApp').style.display=''}document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();var pw=document.getElementById('loginPassword').value;if(btoa(pw)===PW_HASH){sessionStorage.setItem(AUTH_KEY,'1');document.getElementById('loginScreen').style.display='none';document.getElementById('adminApp').style.display='';render()}else{document.getElementById('loginError').textContent='Incorrect password.'}})})();

const groups=[{name:'Brand & Nav',items:[{key:'brand-title',label:'Brand Title',html:'The Angamba Archive'},{key:'brand-subtitle',label:'Brand Subtitle',html:'WWII Relics &#x2022; Manipur'}]},{name:'Hero Section',items:[{key:'hero-name',label:'Name',html:'Arambam Angamba'},{key:'hero-role',label:'Role',html:'Historian &#x2022; Collector &#x2022; Preservationist'},{key:'hero-eyebrow',label:'Eyebrow',html:'A private archive of living history'},{key:'hero-title',label:'Title',html:'Preserving the memory of the Battle of Imphal.'},{key:'hero-bio-1',label:'Bio Paragraph 1',html:'<b>Arambam Angamba</b> is a World War II historian and artifact collector from Manipur, dedicated to protecting the forgotten stories, battlefield relics, and human memories connected to the Imphal&#x2013;Kohima campaign.'},{key:'hero-bio-2',label:'Bio Paragraph 2',html:'Through recovered objects, guided stories, and careful preservation, his work transforms fragments of war into a quiet archive for future generations.'},{key:'hero-quote',label:'Quote',html:'&#x201C;History survives when memory is cared for.&#x201D;'}]},{name:'Mission Section',items:[{key:'mission-eyebrow',label:'Eyebrow',html:'The mission'},{key:'mission-title',label:'Title',html:'A quiet digital museum for a battlefield that should never be forgotten.'},{key:'mission-text',label:'Description',html:'The Angamba Archive presents a refined visual record of World War II artifacts, museum encounters, battlefield walks, and preservation work connected to Manipur&#x2019;s wartime landscape.'}]},{name:'Collection Section',items:[{key:'collection-eyebrow',label:'Eyebrow',html:'Collection'},{key:'collection-title',label:'Title',html:'Relics displayed with restraint, dignity and context.'},{key:'card-01-title',label:'Card 1 Title',html:'Field Relics'},{key:'card-01-text',label:'Card 1 Description',html:'Recovered metal, equipment and wartime traces from historic ground.'},{key:'card-02-title',label:'Card 2 Title',html:'Personal Objects'},{key:'card-02-text',label:'Card 2 Description',html:'Small objects that carry large human stories from the conflict.'},{key:'card-03-title',label:'Card 3 Title',html:'Museum Exhibits'},{key:'card-03-text',label:'Card 3 Description',html:'Uniforms, displays and interpreted material culture.'},{key:'card-04-title',label:'Card 4 Title',html:'Mechanical Remains'},{key:'card-04-text',label:'Card 4 Description',html:'Fragments of equipment preserved as testimony.'},{key:'card-05-title',label:'Card 5 Title',html:'Archive Encounters'},{key:'card-05-text',label:'Card 5 Description',html:'Visitors, researchers and storytellers keeping memory alive.'},{key:'card-06-title',label:'Card 6 Title',html:'Battlefield Walks'},{key:'card-06-text',label:'Card 6 Description',html:'Guided trails through the terrain where history remains present.'}]},{name:'Battlefields Section',items:[{key:'story-eyebrow',label:'Eyebrow',html:'Battlefield memory'},{key:'story-title',label:'Title',html:'From object to evidence. From evidence to story.'},{key:'story-text',label:'Description',html:'Each artifact is treated not as decoration, but as a witness. The website guides visitors through the emotional weight of the objects: where they were found, what they suggest, and why the memory of Imphal matters.'},{key:'stat-1-label',label:'Stat 1 Label',html:'WWII'},{key:'stat-1-value',label:'Stat 1 Value',html:'Imphal Front'},{key:'stat-2-label',label:'Stat 2 Label',html:'Archive'},{key:'stat-2-value',label:'Stat 2 Value',html:'Private Collection'},{key:'stat-3-label',label:'Stat 3 Label',html:'Visitors'},{key:'stat-3-value',label:'Stat 3 Value',html:'Guestbook Ready'}]},{name:'Guestbook Section',items:[{key:'guest-eyebrow',label:'Eyebrow',html:'Visitor guestbook'},{key:'guest-title',label:'Title',html:'Leave a note for the archive.'},{key:'guest-text',label:'Description',html:'Visitors, researchers, students and families can sign the guestbook with their name, country and message. This demo version is ready visually; later we can connect it to Firebase, Supabase or Appwrite.'}]},{name:'Footer',items:[{key:'footer-title',label:'Title',html:'The Angamba Archive'},{key:'footer-text',label:'Description',html:'World War II artifacts, battlefield memory and preservation from Manipur.'}]}];

function loadSaved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return{}}}
function saveAll(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function getHtml(item,d){return d[item.key]||item.html}

function render(){var d=loadSaved(),app=document.getElementById('adminContent');if(!app)return;var html='';for(var g=0;g<groups.length;g++){var group=groups[g];html+='<div class="group"><h2 class="group-title">'+group.name+'</h2><div class="grid">';for(var i=0;i<group.items.length;i++){var item=group.items[i],val=getHtml(item,d),isCustom=item.key in d;html+='<div class="card" data-key="'+item.key+'"><div class="info"><strong>'+item.label+'</strong><span class="key">'+item.key+'</span></div><div class="preview">'+val+'</div><div class="tb"><button class="tb-btn" data-cmd="bold" title="Bold"><b>B</b></button><button class="tb-btn" data-cmd="italic" title="Italic"><i>I</i></button><span class="tb-sep"></span><select class="tb-select" data-cmd="fontSize"><option value="3">Normal</option><option value="1">Small</option><option value="4">Large</option><option value="5">X-Large</option></select><span class="tb-sep"></span><input type="color" class="tb-color" data-cmd="foreColor" value="#59624f" title="Text Color"><span class="tb-sep"></span><button class="tb-btn" data-cmd="removeFormat" title="Clear"><span style="font-size:.75rem">&#10005;</span></button></div><div class="editor" contenteditable="true">'+val+'</div><div class="actions"><button class="btn btn-save">Save</button><span class="badge '+(isCustom?'':'badge-default')+'">'+(isCustom?'Custom':'Default')+'</span></div></div>'}html+='</div></div>'}html+='<div class="footer"><button class="btn btn-reset" id="resetAll">Reset All to Defaults</button><p>Changes stored in your browser (localStorage). Persist until cleared.</p></div>';app.innerHTML=html;

document.querySelectorAll('.card').forEach(function(card){var key=card.dataset.key,editor=card.querySelector('.editor'),preview=card.querySelector('.preview'),saveBtn=card.querySelector('.btn-save'),badge=card.querySelector('.badge');function updatePreview(){preview.innerHTML=editor.innerHTML}
function save(){var d=loadSaved();d[key]=editor.innerHTML;saveAll(d);updatePreview();badge.textContent='Custom';badge.className='badge'}
saveBtn.addEventListener('click',save);editor.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});card.querySelectorAll('.tb-btn').forEach(function(btn){btn.addEventListener('mousedown',function(e){e.preventDefault();editor.focus();document.execCommand(btn.dataset.cmd,false,null)})});card.querySelectorAll('.tb-select').forEach(function(sel){sel.addEventListener('change',function(){editor.focus();document.execCommand(sel.dataset.cmd,false,sel.value);sel.selectedIndex=0})});card.querySelectorAll('.tb-color').forEach(function(picker){picker.addEventListener('input',function(){editor.focus();document.execCommand(picker.dataset.cmd,false,picker.value)})})});document.getElementById('resetAll').addEventListener('click',function(){if(confirm('Reset all text to defaults?')){localStorage.removeItem(STORAGE_KEY);render()}})}
if(sessionStorage.getItem(AUTH_KEY)){render()}
</script>
</body>
</html>
